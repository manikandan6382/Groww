<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradingView Pop-Out Terminal · PortfolioX</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <link rel="stylesheet" href="/css/chart-popout.css" />
</head>
<body>
  <header class="popout-header">
    <div class="popout-sym-group">
      <strong class="popout-sym-title" id="popoutSymbol">NIFTY 50</strong>
      <span class="popout-price" id="popoutLtp">24,180.00</span>
    </div>

    <div class="popout-controls">
      <div class="timeframe-pills">
        <button type="button" class="tf-btn" data-tf="1m">1m</button>
        <button type="button" class="tf-btn active" data-tf="5m">5m</button>
        <button type="button" class="tf-btn" data-tf="15m">15m</button>
        <button type="button" class="tf-btn" data-tf="1h">1h</button>
      </div>
      <div class="popout-status-pill">
        <span class="pulse-dot"></span> 60 FPS Canvas Live
      </div>
    </div>
  </header>

  <main id="popoutChartContainer"></main>

  <script type="module">
    import { TradingViewTerminal } from "./js/tradingview-chart.js";
    const params = new URLSearchParams(window.location.search);
    const symbol = params.get("symbol") || "NIFTY 50";
    document.getElementById("popoutSymbol").textContent = symbol;
    const chartContainer = document.getElementById("popoutChartContainer");
    const terminal = new TradingViewTerminal("popoutChartContainer", {
      symbol,
      timeframe: "5m",
      height: chartContainer.clientHeight || 500
    });
    const basePrice = symbol.includes("BANK") ? 52000 : 24200;
    terminal.loadHistoricalCandles(terminal.generateSampleCandles(basePrice, 80, 5));
    window.addEventListener("resize", () => { 
      if (terminal?.chart && chartContainer) {
        terminal.chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
      }
    });
    document.querySelectorAll(".tf-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tf-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        terminal.setTimeframe(btn.getAttribute("data-tf"));
      });
    });
  </script>
</body>
</html>
