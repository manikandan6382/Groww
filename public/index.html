<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PortfolioX — Pro Trading Terminal & Wealth Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background-color: #070b14;
        color: #f8fafc;
        font-family: 'Outfit', 'Inter', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .loader-card {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 32px;
        border-radius: 20px;
        text-align: center;
        backdrop-filter: blur(20px);
        max-width: 420px;
      }
      .btn-launch {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 20px;
        background: linear-gradient(135deg, #3b82f6, #38bdf8);
        color: white;
        text-decoration: none;
        border-radius: 12px;
        font-weight: 700;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="loader-card">
      <h2 style="margin: 0 0 8px 0; font-size: 18px; color: #fff;">🚀 PortfolioX Modern React Terminal</h2>
      <p style="font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 0 0 16px 0;">
        The legacy 1,800-line monolithic HTML has been upgraded to a modular <strong>React + Vite + Framer Motion</strong> terminal.
      </p>
      <a href="http://localhost:3003" class="btn-launch">Launch Terminal (Port 3003)</a>
    </div>
  </body>
</html>
