<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Primary Technical SEO Metadata -->
    <title>PortfolioX — Real-Time Trading Terminal & Wealth Hub</title>
    <meta name="description" content="High-speed options trading terminal, live Upstox tick streaming, 12-column trade journal, and equity portfolio dashboard for active traders." />
    <meta name="keywords" content="options trading, NIFTY scalping, stock market terminal, Upstox API, Zerodha Kite, trading journal, technical analysis" />
    <meta name="author" content="PortfolioX Finance" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://portfoliox.finance" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portfoliox.finance" />
    <meta property="og:title" content="PortfolioX — Real-Time Trading Terminal & Wealth Hub" />
    <meta property="og:description" content="High-speed options trading terminal, live Upstox tick streaming, 12-column trade journal, and equity portfolio dashboard for active traders." />
    <meta property="og:site_name" content="PortfolioX" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PortfolioX — Real-Time Trading Terminal & Wealth Hub" />
    <meta name="twitter:description" content="High-speed options trading terminal, live Upstox tick streaming, 12-column trade journal, and equity portfolio dashboard for active traders." />

    <!-- Mobile & PWA Theme -->
    <meta name="theme-color" content="#070b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Typography & Font Preconnects (Zero Layout Shift) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PortfolioX",
        "url": "https://portfoliox.finance",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "description": "Real-time trading terminal with live tick streaming, 12-column rapid trade logger, and portfolio tracking.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        },
        "featureList": [
          "Live Upstox v2 REST & WebSocket Tick Streaming",
          "12-Column Rapid Trade Journal Logger with Sequential Tabindex",
          "Interactive TradingView Lightweight Charts (60 FPS)",
          "Dual Broker OAuth Integration (Zerodha Kite & Upstox)",
          "Real-time SVG Financial Sparklines and Net Worth Tracking"
        ]
      }
    </script>
  </head>
  <body class="bg-[#070b14] text-slate-100 antialiased selection:bg-cyan-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
